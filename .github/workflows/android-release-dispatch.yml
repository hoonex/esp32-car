name: Dispatch Trusted Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Release the current validated main build or only refresh the signing cache
        required: true
        default: release
        type: choice
        options:
          - release
          - keepalive
  schedule:
    - cron: '23 4 * * 1,4'

permissions:
  contents: write
  actions: write

concurrency:
  group: android-release-dispatch
  cancel-in-progress: true

env:
  SIGNING_ANCHOR_TAG: android-signing-v2
  TRUSTED_WORKFLOW: android-release-trusted.yml

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve trusted source and validated run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          PROCEED=true

          if [ "$EVENT_NAME" = "schedule" ]; then
            SOURCE_SHA="$MAIN_SHA"
            MODE="keepalive"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SOURCE_SHA="$MAIN_SHA"
            MODE="${MANUAL_MODE:-release}"
          else
            SOURCE_SHA="$PUSH_SHA"
            MODE="release"
            if [ "$SOURCE_SHA" != "$MAIN_SHA" ]; then
              echo "Push source $PUSH_SHA was superseded by main $MAIN_SHA; skipping stale dispatch."
              PROCEED=false
            fi
          fi

          VALIDATED_RUN_ID=""
          if [ "$PROCEED" = "true" ] && [ "$MODE" = "release" ]; then
            echo "Waiting for Build Android + Firmware to validate $SOURCE_SHA..."
            for attempt in $(seq 1 60); do
              RUN_ROW="$(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow android.yml \
                  --branch main \
                  --event push \
                  --limit 50 \
                  --json databaseId,headSha,status,conclusion \
                  --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | [.databaseId, .status, (.conclusion // \"\")] | @tsv" \
                  | head -n 1
              )"

              if [ -n "$RUN_ROW" ]; then
                IFS=$'\t' read -r RUN_ID RUN_STATUS RUN_CONCLUSION <<< "$RUN_ROW"
                echo "Validation run $RUN_ID: $RUN_STATUS ${RUN_CONCLUSION:-pending}"
                if [ "$RUN_STATUS" = "completed" ]; then
                  if [ "$RUN_CONCLUSION" = "success" ]; then
                    VALIDATED_RUN_ID="$RUN_ID"
                    break
                  fi
                  echo "::error::Build Android + Firmware run $RUN_ID completed with $RUN_CONCLUSION for $SOURCE_SHA."
                  exit 1
                fi
              else
                echo "Validation run for $SOURCE_SHA is not visible yet (attempt $attempt/60)."
              fi

              sleep 10
            done

            if [ -z "$VALIDATED_RUN_ID" ]; then
              echo "::error::Timed out waiting for a successful Build Android + Firmware push run for $SOURCE_SHA."
              exit 1
            fi
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "validated_run_id=$VALIDATED_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"
          echo "Trusted source: $SOURCE_SHA"
          echo "Mode: $MODE"
          echo "Proceed: $PROCEED"
          [ -z "$VALIDATED_RUN_ID" ] || echo "Validated run: $VALIDATED_RUN_ID"

      - name: Create or verify immutable signing anchor
        if: steps.source.outputs.proceed == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$SIGNING_ANCHOR_TAG" >/dev/null; then
            ANCHOR_SHA="$(git rev-list -n 1 "$SIGNING_ANCHOR_TAG")"
            git cat-file -e "$ANCHOR_SHA:.github/workflows/$TRUSTED_WORKFLOW"
            echo "Signing anchor already exists at $ANCHOR_SHA."
          else
            git cat-file -e "$SOURCE_SHA:.github/workflows/$TRUSTED_WORKFLOW"
            git tag "$SIGNING_ANCHOR_TAG" "$SOURCE_SHA"
            git push origin "refs/tags/$SIGNING_ANCHOR_TAG"
            echo "Created signing anchor $SIGNING_ANCHOR_TAG at $SOURCE_SHA."
          fi

      - name: Dispatch tag-scoped trusted signer
        if: steps.source.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          VALIDATED_RUN_ID: ${{ steps.source.outputs.validated_run_id }}
          MODE: ${{ steps.source.outputs.mode }}
        run: |
          set -euo pipefail
          gh workflow run "$TRUSTED_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$SIGNING_ANCHOR_TAG" \
            -f "mode=$MODE" \
            -f "source_sha=$SOURCE_SHA" \
            -f "validated_run_id=$VALIDATED_RUN_ID"
          echo "Dispatched $TRUSTED_WORKFLOW on tag $SIGNING_ANCHOR_TAG for $SOURCE_SHA."
