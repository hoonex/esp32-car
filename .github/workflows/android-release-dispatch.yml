name: Dispatch Trusted Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Release the current validated main build or only refresh the signing cache
        required: true
        default: release
        type: choice
        options:
          - release
          - keepalive
  schedule:
    - cron: '23 4 * * 1,4'

permissions:
  contents: write
  actions: write

concurrency:
  group: android-release-dispatch
  cancel-in-progress: true

env:
  SIGNING_ANCHOR_TAG: android-signing-v2
  TRUSTED_WORKFLOW: android-release-trusted.yml

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve trusted source and validated run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          PROCEED=true

          if [ "$EVENT_NAME" = "schedule" ]; then
            SOURCE_SHA="$MAIN_SHA"
            MODE="keepalive"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SOURCE_SHA="$MAIN_SHA"
            MODE="${MANUAL_MODE:-release}"
          else
            SOURCE_SHA="$PUSH_SHA"
            MODE="release"
            if [ "$SOURCE_SHA" != "$MAIN_SHA" ]; then
              echo "Push source $PUSH_SHA was superseded by main $MAIN_SHA; skipping stale dispatch."
              PROCEED=false
            fi
          fi

          VALIDATED_RUN_ID=""
          if [ "$PROCEED" = "true" ] && [ "$MODE" = "release" ]; then
            echo "Waiting for Build Android + Firmware to validate $SOURCE_SHA..."
            for attempt in $(seq 1 60); do
              RUN_ROW="$(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow android.yml \
                  --branch main \
                  --event push \
                  --limit 50 \
                  --json databaseId,headSha,status,conclusion \
                  --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | [.databaseId, .status, (.conclusion // \"\")] | @tsv" \
                  | head -n 1
              )"

              if [ -n "$RUN_ROW" ]; then
                IFS=$'\t' read -r RUN_ID RUN_STATUS RUN_CONCLUSION <<< "$RUN_ROW"
                echo "Validation run $RUN_ID: $RUN_STATUS ${RUN_CONCLUSION:-pending}"
                if [ "$RUN_STATUS" = "completed" ]; then
                  if [ "$RUN_CONCLUSION" = "success" ]; then
                    VALIDATED_RUN_ID="$RUN_ID"
                    break
                  fi
                  echo "::error::Build Android + Firmware run $RUN_ID completed with $RUN_CONCLUSION for $SOURCE_SHA."
                  exit 1
                fi
              else
                echo "Validation run for $SOURCE_SHA is not visible yet (attempt $attempt/60)."
              fi

              sleep 10
            done

            if [ -z "$VALIDATED_RUN_ID" ]; then
              echo "::error::Timed out waiting for a successful Build Android + Firmware push run for $SOURCE_SHA."
              exit 1
            fi
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "validated_run_id=$VALIDATED_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"
          echo "Trusted source: $SOURCE_SHA"
          echo "Mode: $MODE"
          echo "Proceed: $PROCEED"
          [ -z "$VALIDATED_RUN_ID" ] || echo "Validated run: $VALIDATED_RUN_ID"

      - name: Create or verify immutable signing anchor
        if: steps.source.outputs.proceed == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$SIGNING_ANCHOR_TAG" >/dev/null; then
            ANCHOR_SHA="$(git rev-list -n 1 "$SIGNING_ANCHOR_TAG")"
            git cat-file -e "$ANCHOR_SHA:.github/workflows/$TRUSTED_WORKFLOW"
            echo "Signing anchor already exists at $ANCHOR_SHA."
          else
            git cat-file -e "$SOURCE_SHA:.github/workflows/$TRUSTED_WORKFLOW"
            git tag "$SIGNING_ANCHOR_TAG" "$SOURCE_SHA"
            git push origin "refs/tags/$SIGNING_ANCHOR_TAG"
            echo "Created signing anchor $SIGNING_ANCHOR_TAG at $SOURCE_SHA."
          fi

      - name: Dispatch tag-scoped trusted signer
        if: steps.source.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          VALIDATED_RUN_ID: ${{ steps.source.outputs.validated_run_id }}
          MODE: ${{ steps.source.outputs.mode }}
        run: |
          set -euo pipefail
          gh workflow run "$TRUSTED_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$SIGNING_ANCHOR_TAG" \
            -f "mode=$MODE" \
            -f "source_sha=$SOURCE_SHA" \
            -f "validated_run_id=$VALIDATED_RUN_ID"
          echo "Dispatched $TRUSTED_WORKFLOW on tag $SIGNING_ANCHOR_TAG for $SOURCE_SHA."

      - name: Reconcile published Android release notes
        if: steps.source.outputs.proceed == 'true' && steps.source.outputs.mode == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          TAG="android-v${VERSION}"
          RELEASE_JSON="$RUNNER_TEMP/release.json"
          FOUND=false

          echo "Waiting for trusted signer to publish or preserve $TAG..."
          for attempt in $(seq 1 30); do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RELEASE_JSON" 2>/dev/null; then
              FOUND=true
              break
            fi
            echo "$TAG not visible yet (attempt $attempt/30)."
            sleep 10
          done

          if [ "$FOUND" != "true" ]; then
            echo "::error::Timed out waiting for $TAG."
            exit 1
          fi

          APK_NAME="ESP32-Car-v${VERSION}.apk"
          jq -e --arg apk "$APK_NAME" '
            ([.assets[].name] | index($apk)) != null and
            ([.assets[].name] | index("ANDROID_SIGNING_CERT_SHA256.txt")) != null and
            ([.assets[].name] | index("SOURCE_COMMIT.txt")) != null and
            ([.assets[].name] | index("firmware-manifest.json")) != null
          ' "$RELEASE_JSON" >/dev/null

          META_DIR="$RUNNER_TEMP/release-meta"
          rm -rf "$META_DIR"
          mkdir -p "$META_DIR"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'SOURCE_COMMIT.txt' \
            --dir "$META_DIR"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'firmware-manifest.json' \
            --dir "$META_DIR"

          RELEASE_SOURCE="$(tr -d '\r\n ' < "$META_DIR/SOURCE_COMMIT.txt")"
          test -n "$RELEASE_SOURCE"
          TARGET_SHA="$(jq -r '.target_commitish // ""' "$RELEASE_JSON")"
          if [ "$TARGET_SHA" != "$RELEASE_SOURCE" ]; then
            echo "::error::$TAG target $TARGET_SHA does not match SOURCE_COMMIT.txt $RELEASE_SOURCE."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SOURCE" "$SOURCE_SHA"; then
            echo "::error::$TAG source $RELEASE_SOURCE is not an ancestor of current main $SOURCE_SHA."
            exit 1
          fi

          RELEASE_VERSION="$(git show "$RELEASE_SOURCE:app/build.gradle.kts" | grep -oP 'versionName\s*=\s*"\K[^"]+' | head -n 1)"
          if [ "$RELEASE_VERSION" != "$VERSION" ]; then
            echo "::error::$TAG source declares v$RELEASE_VERSION, expected v$VERSION."
            exit 1
          fi

          UPDATER_SOURCE="$RUNNER_TEMP/AppUpdater-release.kt"
          git show "$RELEASE_SOURCE:app/src/main/java/io/github/hoonex/esp32car/update/AppUpdater.kt" > "$UPDATER_SOURCE"
          grep -F 'A newer APK is never downloaded until the user requests it.' "$UPDATER_SOURCE"
          grep -F 'Download and validate the release selected by the metadata check. This is user initiated.' "$UPDATER_SOURCE"
          grep -F 'fun installReadyUpdate(activity: Activity)' "$UPDATER_SOURCE"

          FW_VERSION="$(jq -r '.version // empty' "$META_DIR/firmware-manifest.json")"
          test -n "$FW_VERSION"

          cat > "$RUNNER_TEMP/RELEASE_NOTES.md" <<EOF
          ESP32 Car Android v${VERSION}

          - Zero-touch GitHub Actions release for the personal/internal in-app update channel
          - Signing identity is isolated in the fixed android-signing-v2 tag cache scope, not the default-branch cache
          - Primary and backup signing caches must agree; missing caches after any persistent-signed Android release cause a hard failure instead of silent key rotation
          - Every new APK signer is compared with the previously published persistent Android signer before release
          - Automatic release metadata checks remain enabled; APK download starts only after the user presses update
          - Downloaded APKs are package/version/SHA-256/signing-certificate verified and persistently staged
          - Installation starts only after an explicit user install action; if the car is connected, the requested install path stops control and disconnects Bluetooth before opening Android's installer
          - First transition from an older CI/debug signer can still require one uninstall/reinstall

          App source: ${RELEASE_SOURCE}
          ESP32 firmware: ${FW_VERSION}
          Hardware: AI Thinker ESP32-CAM, 4MB flash, 2WD L298N profile.
          EOF

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
          echo "Reconciled $TAG release notes with the updater behavior in $RELEASE_SOURCE."
