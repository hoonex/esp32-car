name: Trusted Android Release Signer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a release or only refresh and verify signing continuity
        required: true
        type: choice
        options:
          - release
          - keepalive
      source_sha:
        description: Exact current main commit to verify and optionally release
        required: true
        type: string
      validated_run_id:
        description: Successful Build Android + Firmware run that validated source_sha
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: trusted-android-release-signer
  cancel-in-progress: false

env:
  SIGNING_ANCHOR_TAG: android-signing-v2
  PRIMARY_CACHE_KEY: esp32-car-android-signing-v2-primary-Linux
  BACKUP_CACHE_KEY: esp32-car-android-signing-v2-backup-Linux

jobs:
  sign-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Enforce tag-scoped trust boundary
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/tags/$SIGNING_ANCHOR_TAG" ]; then
            echo "::error::Trusted signing workflow must run from refs/tags/$SIGNING_ANCHOR_TAG, not $GITHUB_REF."
            exit 1
          fi
          echo "Trusted signer anchored at $GITHUB_REF ($GITHUB_SHA)."

      - name: Check out exact source without changing workflow scope
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: source

      - name: Prove source is current main
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git -C source fetch --no-tags origin main
          MAIN_SHA="$(git -C source rev-parse origin/main)"
          SOURCE_COMMIT="$(git -C source rev-parse HEAD)"
          if [ "$SOURCE_COMMIT" != "$SOURCE_SHA" ] || [ "$SOURCE_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Refusing stale or substituted source. requested=$SOURCE_SHA checked_out=$SOURCE_COMMIT main=$MAIN_SHA"
            exit 1
          fi
          echo "Source proof: current main is $SOURCE_SHA."

      - name: Prove upstream validation for release mode
        if: inputs.mode == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
        run: |
          set -euo pipefail
          if [ -z "$VALIDATED_RUN_ID" ]; then
            echo "::error::Release mode requires a validated Build Android + Firmware run id."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN_ID" > "$RUNNER_TEMP/validated-run.json"
          jq -e \
            --arg source "$SOURCE_SHA" \
            '.name == "Build Android + Firmware" and
             .path == ".github/workflows/android.yml" and
             .event == "push" and
             .head_branch == "main" and
             .head_sha == $source and
             .status == "completed" and
             .conclusion == "success"' \
            "$RUNNER_TEMP/validated-run.json" >/dev/null
          echo "Validated upstream run $VALIDATED_RUN_ID for $SOURCE_SHA."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore primary signing identity
        id: primary-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/esp32-car-signing/primary
          key: ${{ env.PRIMARY_CACHE_KEY }}

      - name: Restore backup signing identity
        id: backup-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/esp32-car-signing/backup
          key: ${{ env.BACKUP_CACHE_KEY }}

      - name: Establish and verify signing continuity
        id: signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LANG=C
          ROOT="$HOME/.android/esp32-car-signing"
          PRIMARY_DIR="$ROOT/primary"
          BACKUP_DIR="$ROOT/backup"
          PRIMARY="$PRIMARY_DIR/release.jks"
          BACKUP="$BACKUP_DIR/release.jks"
          PRIMARY_META="$PRIMARY_DIR/signing.env"
          BACKUP_META="$BACKUP_DIR/signing.env"
          mkdir -p "$PRIMARY_DIR" "$BACKUP_DIR"

          PRIMARY_OK=false
          BACKUP_OK=false
          [ -s "$PRIMARY" ] && [ -s "$PRIMARY_META" ] && PRIMARY_OK=true
          [ -s "$BACKUP" ] && [ -s "$BACKUP_META" ] && BACKUP_OK=true

          PREVIOUS_TAG="$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.draft == false and (.tag_name | startswith("android-v")) and (([.assets[].name] | index("ANDROID_SIGNING_CERT_SHA256.txt")) != null))][0].tag_name // ""'
          )"

          if [ "$PRIMARY_OK" = true ] && [ "$BACKUP_OK" = true ]; then
            if ! cmp -s "$PRIMARY" "$BACKUP" || ! cmp -s "$PRIMARY_META" "$BACKUP_META"; then
              echo "::error::Primary and backup signing caches disagree; refusing to choose a signer."
              exit 1
            fi
            echo "Primary and backup signing identities agree."
          elif [ "$PRIMARY_OK" = true ]; then
            cp "$PRIMARY" "$BACKUP"
            cp "$PRIMARY_META" "$BACKUP_META"
            echo "Recovered missing backup from primary signing identity."
          elif [ "$BACKUP_OK" = true ]; then
            cp "$BACKUP" "$PRIMARY"
            cp "$BACKUP_META" "$PRIMARY_META"
            echo "Recovered missing primary from backup signing identity."
          else
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "::error::Both signing caches are missing but persistent-signed Android release $PREVIOUS_TAG already exists. Refusing silent signer rotation."
              exit 1
            fi
            STORE_VALUE="$(openssl rand -base64 36 | tr -d '\r\n')"
            KEY_VALUE="$(openssl rand -base64 36 | tr -d '\r\n')"
            KEY_ALIAS="esp32-car-update"
            keytool -genkeypair \
              -keystore "$PRIMARY" \
              -storetype JKS \
              -storepass "$STORE_VALUE" \
              -keypass "$KEY_VALUE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=ESP32 Car Update,OU=Personal,O=hoonex,C=KR" \
              -noprompt
            printf 'STORE_VALUE=%s\nKEY_VALUE=%s\nKEY_ALIAS=%s\n' "$STORE_VALUE" "$KEY_VALUE" "$KEY_ALIAS" > "$PRIMARY_META"
            chmod 600 "$PRIMARY" "$PRIMARY_META"
            cp "$PRIMARY" "$BACKUP"
            cp "$PRIMARY_META" "$BACKUP_META"
            echo "Created first tag-scoped Android signing identity."
          fi

          set -a
          . "$PRIMARY_META"
          set +a
          test -n "$STORE_VALUE" && test -n "$KEY_VALUE" && test -n "$KEY_ALIAS"

          keytool -list \
            -keystore "$PRIMARY" \
            -storepass "$STORE_VALUE" \
            -alias "$KEY_ALIAS" >/dev/null

          keytool -exportcert \
            -rfc \
            -keystore "$PRIMARY" \
            -storepass "$STORE_VALUE" \
            -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/android-signing-cert.pem"

          SIGNER="$(
            openssl x509 \
              -in "$RUNNER_TEMP/android-signing-cert.pem" \
              -noout \
              -fingerprint \
              -sha256 \
              | sed 's/^[^=]*=//' \
              | tr -d ':\r\n ' \
              | tr '[:lower:]' '[:upper:]'
          )"
          test -n "$SIGNER"
          printf '%s\n' "$SIGNER" > "$RUNNER_TEMP/ANDROID_SIGNING_CERT_SHA256.txt"

          if [ -n "$PREVIOUS_TAG" ]; then
            mkdir -p "$RUNNER_TEMP/previous-release"
            gh release download "$PREVIOUS_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'ANDROID_SIGNING_CERT_SHA256.txt' \
              --dir "$RUNNER_TEMP/previous-release"
            EXPECTED="$(tr -d ':\r\n ' < "$RUNNER_TEMP/previous-release/ANDROID_SIGNING_CERT_SHA256.txt" | tr '[:lower:]' '[:upper:]')"
            test -n "$EXPECTED"
            if [ "$SIGNER" != "$EXPECTED" ]; then
              echo "::error::Cached signer does not match published persistent Android lineage from $PREVIOUS_TAG."
              exit 1
            fi
            echo "Signing continuity matches $PREVIOUS_TAG: $SIGNER"
          else
            echo "First persistent Android release signer established: $SIGNER"
          fi

          echo "cert_sha256=$SIGNER" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Save recovered or new primary signing cache immediately
        if: steps.primary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/esp32-car-signing/primary
          key: ${{ env.PRIMARY_CACHE_KEY }}

      - name: Save recovered or new backup signing cache immediately
        if: steps.backup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/esp32-car-signing/backup
          key: ${{ env.BACKUP_CACHE_KEY }}

      - name: Keepalive complete
        if: inputs.mode == 'keepalive'
        shell: bash
        run: echo "Signing identity restored, cross-checked, and both cache copies refreshed."

      - name: Resolve immutable Android release tag
        if: inputs.mode == 'release'
        id: release-meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' source/app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          TAG="android-v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG; exists=$EXISTS"

      - name: Preserve existing immutable app release
        if: inputs.mode == 'release' && steps.release-meta.outputs.exists == 'true'
        shell: bash
        run: echo "${{ steps.release-meta.outputs.tag }} already exists and its APK will not be replaced."

      - name: Download firmware from exact validated run
        if: inputs.mode == 'release' && steps.release-meta.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: esp32-car-firmware
          path: .ci-firmware
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.validated_run_id }}

      - name: Bundle validated firmware into release source
        if: inputs.mode == 'release' && steps.release-meta.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/app/src/main/assets/firmware
          cp .ci-firmware/firmware.bin source/app/src/main/assets/firmware/esp32-car.bin
          cp .ci-firmware/manifest.json source/app/src/main/assets/firmware/manifest.json
          test -s source/app/src/main/assets/firmware/esp32-car.bin
          test -s source/app/src/main/assets/firmware/manifest.json

      - name: Set up Gradle 9.3.1
        if: inputs.mode == 'release' && steps.release-meta.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build with tag-scoped signing identity
        if: inputs.mode == 'release' && steps.release-meta.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$HOME/.android/esp32-car-signing/primary/signing.env"
          set +a
          export ANDROID_KEYSTORE_PATH="$HOME/.android/esp32-car-signing/primary/release.jks"
          export ANDROID_KEYSTORE_PASSWORD="$STORE_VALUE"
          export ANDROID_KEY_ALIAS="$KEY_ALIAS"
          export ANDROID_KEY_PASSWORD="$KEY_VALUE"
          cd source
          gradle :app:assembleRelease --stacktrace --no-daemon
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify release APK signer and package payload
        if: inputs.mode == 'release' && steps.release-meta.outputs.exists != 'true'
        shell: bash
        env:
          EXPECTED_SIGNER: ${{ steps.signing.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          APK="source/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner.txt"
          cat "$RUNNER_TEMP/apksigner.txt"
          APK_SIGNER="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" \
              | head -n 1 \
              | tr -d ':\r\n ' \
              | tr '[:lower:]' '[:upper:]'
          )"
          test -n "$APK_SIGNER"
          if [ "$APK_SIGNER" != "$EXPECTED_SIGNER" ]; then
            echo "::error::Built APK signer does not match trusted signing identity."
            exit 1
          fi
          unzip -l "$APK" | grep 'assets/firmware/esp32-car.bin'
          unzip -l "$APK" | grep 'assets/firmware/manifest.json'
          echo "Verified release APK signer $APK_SIGNER."

      - name: Prepare immutable release assets
        if: inputs.mode == 'release' && steps.release-meta.outputs.exists != 'true'
        shell: bash
        env:
          APP_VERSION: ${{ steps.release-meta.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          FW_VERSION="$(jq -r '.version' .ci-firmware/manifest.json)"
          test -n "$FW_VERSION" && test "$FW_VERSION" != "null"
          mkdir -p release
          cp source/app/build/outputs/apk/release/app-release.apk "release/ESP32-Car-v${APP_VERSION}.apk"
          cp .ci-firmware/firmware.bin "release/ESP32-Car-AI-Thinker-2WD-OTA-v${FW_VERSION}.bin"
          cp .ci-firmware/manifest.json release/firmware-manifest.json
          cp "$RUNNER_TEMP/ANDROID_SIGNING_CERT_SHA256.txt" release/ANDROID_SIGNING_CERT_SHA256.txt
          printf '%s\n' "$SOURCE_SHA" > release/SOURCE_COMMIT.txt
          (
            cd release
            sha256sum \
              "ESP32-Car-v${APP_VERSION}.apk" \
              "ESP32-Car-AI-Thinker-2WD-OTA-v${FW_VERSION}.bin" \
              firmware-manifest.json \
              ANDROID_SIGNING_CERT_SHA256.txt \
              SOURCE_COMMIT.txt \
              > SHA256SUMS.txt
          )
          cat > release/RELEASE_NOTES.md <<EOF
          ESP32 Car Android v${APP_VERSION}

          - Zero-touch GitHub Actions release for the personal/internal in-app update channel
          - Signing identity is isolated in the fixed android-signing-v2 tag cache scope, not the default-branch cache
          - Primary and backup signing caches must agree; missing caches after any persistent-signed Android release cause a hard failure instead of silent key rotation
          - Every new APK signer is compared with the previously published persistent Android signer before release
          - Automatic release metadata checks remain enabled; APK download and installation are user-initiated
          - User-requested APK downloads remain verified and persistently staged until the user presses install
          - Android package/version/SHA-256/signing-certificate validation remains enforced before installation
          - First transition from an older CI/debug signer can still require one uninstall/reinstall

          App source: ${SOURCE_SHA}
          ESP32 firmware: ${FW_VERSION}
          Hardware: AI Thinker ESP32-CAM, 4MB flash, 2WD L298N profile.
          EOF
          echo "FW_VERSION=$FW_VERSION" >> "$GITHUB_ENV"

      - name: Publish signed GitHub Release
        if: inputs.mode == 'release' && steps.release-meta.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-meta.outputs.tag }}
          APP_VERSION: ${{ steps.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ inputs.source_sha }}" \
            --title "ESP32 Car Android v${APP_VERSION}" \
            --notes-file release/RELEASE_NOTES.md \
            "release/ESP32-Car-v${APP_VERSION}.apk" \
            "release/ESP32-Car-AI-Thinker-2WD-OTA-v${FW_VERSION}.bin" \
            release/firmware-manifest.json \
            release/ANDROID_SIGNING_CERT_SHA256.txt \
            release/SOURCE_COMMIT.txt \
            release/SHA256SUMS.txt