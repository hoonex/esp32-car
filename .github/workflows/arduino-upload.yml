name: Verify Arduino Sketch Upload Path

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arduino-sketch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core 3.3.0
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.0

      - name: Verify v4 hybrid recovery contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          text = Path('firmware/ESP32_CAM_RC_Controller.ino').read_text(encoding='utf-8')
          for required in (
              'FW_VERSION = "4.0.1"',
              'SerialBT.begin("ESP32_CAM_RC")',
              'bool startControlServer()',
              'bool startStreamServer()',
              'startControlServer();',
              'if (startCamera()) startStreamServer();',
              '/api/info',
              '/api/ota',
              'http_ready',
              'stream_ready',
              'CAM_RETRY',
              'ledcAttachChannel(MOTOR_R_PIN_1',
              'MOTOR_R_CH_1 = 8',
              'config.ledc_channel = LEDC_CHANNEL_0',
          ):
              if required not in text:
                  raise SystemExit(f'missing v4 contract: {required}')

          connect_start = text.index('bool connectWifiAndStartServices')
          connect_end = text.index('\nvoid processBluetoothCommand', connect_start)
          connect_block = text[connect_start:connect_end]
          if connect_block.index('startControlServer();') >= connect_block.index('startCamera()'):
              raise SystemExit('port 80 must start before camera initialization')

          control_start = text.index('bool startControlServer()')
          control_end = text.index('\nbool startStreamServer()', control_start)
          control_block = text[control_start:control_end]
          if 'startCamera(' in control_block or 'cameraReady' in control_block:
              raise SystemExit('port 80 server must not depend on camera initialization')

          print('v4 hybrid contract OK: BT drive + independent :80 OTA + isolated camera LEDC channel')
          PY

      - name: Build exact sketch package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/arduino-sketch
          mkdir -p dist/arduino-sketch/ESP32_CAM_RC_Controller
          cp firmware/ESP32_CAM_RC_Controller.ino dist/arduino-sketch/ESP32_CAM_RC_Controller/ESP32_CAM_RC_Controller.ino
          cp firmware/partitions.csv dist/arduino-sketch/ESP32_CAM_RC_Controller/partitions.csv
          cp tools/arduino/Upload-ESP32-Car.ps1 dist/arduino-sketch/Upload-ESP32-Car.ps1
          cat > dist/arduino-sketch/README.txt <<'EOF'
          ESP32 Car v4.0.1 - canonical first install / recovery path

          Physically trusted first-install path:
          1. Open ESP32_CAM_RC_Controller/ESP32_CAM_RC_Controller.ino in Arduino IDE.
          2. Select AI Thinker ESP32-CAM / ESP32 Wrover-compatible ESP32-CAM board setup.
          3. Select the programmer COM port.
          4. Upload the sketch.
          5. If manual download mode is required: GPIO0 -> GND, reset, upload, then disconnect GPIO0 and reset again.
          6. Expected Bluetooth name after boot: ESP32_CAM_RC.

          v4 keeps Bluetooth alive for driving while Wi-Fi runs camera/status/HTTP OTA in parallel.
          Port 80 starts even if OV2640 initialization fails. Port 81 is MJPEG only.
          Motor/flash PWM uses explicit LEDC channels 8-12 so camera XCLK can own channel 0.
          Upload-ESP32-Car.ps1 is optional; the direct Arduino IDE .ino upload remains the physical baseline.
          EOF

      - name: Compile packaged sketch exactly as Arduino
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile \
            --fqbn esp32:esp32:esp32cam \
            dist/arduino-sketch/ESP32_CAM_RC_Controller

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/arduino-sketch/ESP32_CAM_RC_Controller/ESP32_CAM_RC_Controller.ino
          test -s dist/arduino-sketch/ESP32_CAM_RC_Controller/partitions.csv
          test -s dist/arduino-sketch/Upload-ESP32-Car.ps1
          grep -F 'FW_VERSION = "4.0.1"' dist/arduino-sketch/ESP32_CAM_RC_Controller/ESP32_CAM_RC_Controller.ino
          grep -F 'arduino-cli upload --verbose' dist/arduino-sketch/Upload-ESP32-Car.ps1

      - name: Upload Arduino sketch package
        uses: actions/upload-artifact@v4
        with:
          name: esp32-car-arduino-sketch
          path: dist/arduino-sketch/
          if-no-files-found: error
