name: Verify Android Release Trust Boundary

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'hardening/**']
    paths:
      - '.github/workflows/android.yml'
      - '.github/workflows/android-release-dispatch.yml'
      - '.github/workflows/android-release-trusted.yml'
      - '.github/workflows/android-release-contract.yml'
      - 'tools/android/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - '.github/workflows/android-release-dispatch.yml'
      - '.github/workflows/android-release-trusted.yml'
      - '.github/workflows/android-release-contract.yml'
      - 'tools/android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-boundary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify zero-touch signer isolation contract
        shell: bash
        run: |
          set -euo pipefail

          CI=.github/workflows/android.yml
          DISPATCH=.github/workflows/android-release-dispatch.yml
          TRUSTED=.github/workflows/android-release-trusted.yml

          test -s "$CI"
          test -s "$DISPATCH"
          test -s "$TRUSTED"

          if grep -Eq 'secrets\.ANDROID_|ANDROID_KEYSTORE_B64|release-android:' "$CI"; then
            echo '::error::Normal CI must not own persistent Android signing or release secrets.'
            exit 1
          fi
          if grep -Fq 'actions/cache' "$CI"; then
            echo '::error::Normal main/PR CI must not restore the Android signing cache.'
            exit 1
          fi

          grep -F 'SIGNING_ANCHOR_TAG: android-signing-v2' "$DISPATCH"
          grep -F -- '--ref "$SIGNING_ANCHOR_TAG"' "$DISPATCH"
          grep -F 'branches: [main]' "$DISPATCH"
          grep -F 'PUSH_SHA:' "$DISPATCH"
          grep -F 'github.sha' "$DISPATCH"
          grep -F -- '--workflow android.yml' "$DISPATCH"
          grep -F -- '--event push' "$DISPATCH"
          grep -F 'Waiting for Build Android + Firmware to validate $SOURCE_SHA' "$DISPATCH"
          grep -F 'Build Android + Firmware run $RUN_ID completed with $RUN_CONCLUSION' "$DISPATCH"
          grep -F 'Timed out waiting for a successful Build Android + Firmware push run for $SOURCE_SHA' "$DISPATCH"
          grep -F 'Push source $PUSH_SHA was superseded by main $MAIN_SHA' "$DISPATCH"
          if grep -Fq 'workflow_run:' "$DISPATCH"; then
            echo '::error::Release dispatch must not depend on workflow_run delivery.'
            exit 1
          fi

          grep -F 'timeout-minutes: 20' "$DISPATCH"
          grep -F 'Reconcile published Android release notes' "$DISPATCH"
          grep -F "steps.source.outputs.mode == 'release'" "$DISPATCH"
          grep -F 'index("SOURCE_COMMIT.txt")' "$DISPATCH"
          grep -F 'index("firmware-manifest.json")' "$DISPATCH"
          grep -F 'git merge-base --is-ancestor "$RELEASE_SOURCE" "$SOURCE_SHA"' "$DISPATCH"
          grep -F 'A newer APK is never downloaded until the user requests it.' "$DISPATCH"
          grep -F 'Download and validate the release selected by the metadata check. This is user initiated.' "$DISPATCH"
          grep -F 'gh release edit "$TAG"' "$DISPATCH"

          grep -F 'SIGNING_ANCHOR_TAG: android-signing-v2' "$TRUSTED"
          grep -F 'refs/tags/$SIGNING_ANCHOR_TAG' "$TRUSTED"
          grep -F 'actions/cache/restore@v4' "$TRUSTED"
          grep -F 'PRIMARY_CACHE_KEY: esp32-car-android-signing-v2-primary-Linux' "$TRUSTED"
          grep -F 'BACKUP_CACHE_KEY: esp32-car-android-signing-v2-backup-Linux' "$TRUSTED"
          grep -F 'run: sdkmanager "platforms;android-36" "build-tools;36.0.0"' "$TRUSTED"
          if grep -Fq 'yes | sdkmanager' "$TRUSTED"; then
            echo '::error::Trusted signer SDK installation must not fail on yes SIGPIPE under pipefail.'
            exit 1
          fi
          grep -F 'index("ANDROID_SIGNING_CERT_SHA256.txt")' "$TRUSTED"
          grep -F 'Both signing caches are missing but persistent-signed Android release' "$TRUSTED"
          grep -F 'Primary and backup signing caches disagree' "$TRUSTED"
          grep -F 'Refusing silent signer rotation' "$TRUSTED"
          grep -F 'does not match published persistent Android lineage' "$TRUSTED"
          grep -F 'ANDROID_SIGNING_CERT_SHA256.txt' "$TRUSTED"
          grep -F '.head_sha == $source' "$TRUSTED"
          grep -F '.conclusion == "success"' "$TRUSTED"

          if git ls-files '*.jks' '*.keystore' | grep -q .; then
            echo '::error::Signing keystore material must never be tracked by git.'
            git ls-files '*.jks' '*.keystore'
            exit 1
          fi

          test ! -e .github/workflows/signing-bootstrap.yml
          test ! -e tools/android/bootstrap-release-signing.ps1

          echo 'Zero-touch Android signing trust boundary verified.'
