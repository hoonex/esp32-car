name: Publish v3.1.0 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v3.1.0.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified main artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/android out/firmware out/windows release
          gh run download 33645203335 --repo "$GITHUB_REPOSITORY" --name esp32-car-ota-debug-apk --dir out/android
          gh run download 33645203335 --repo "$GITHUB_REPOSITORY" --name esp32-car-firmware --dir out/firmware
          gh run download 33645203335 --repo "$GITHUB_REPOSITORY" --name esp32-car-first-install-windows --dir out/windows

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find out/android -type f -name '*.apk' | head -n1)"
          WIN="$(find out/windows -type f -name '*.zip' | head -n1)"
          FW="$(find out/firmware -type f -name 'firmware.bin' | head -n1)"
          test -f "$APK"
          test -f "$WIN"
          test -f "$FW"

          cp "$APK" release/ESP32-Car-OTA-v3.1.0-debug.apk
          cp "$WIN" release/ESP32-Car-First-Install-Windows.zip
          cp "$FW" release/firmware.bin
          (cd out/firmware && zip -q -r ../../release/ESP32-Car-Firmware-v3.1.0.zip .)

          mkdir -p package/Android package/Firmware package/Windows-First-Install
          cp release/ESP32-Car-OTA-v3.1.0-debug.apk package/Android/
          cp release/ESP32-Car-Firmware-v3.1.0.zip package/Firmware/
          cp release/firmware.bin package/Firmware/
          cp release/ESP32-Car-First-Install-Windows.zip package/Windows-First-Install/
          cat > package/README.txt <<'EOF'
          ESP32 Car v3.1.0

          First installation / recovery:
          1. Extract Windows-First-Install/ESP32-Car-First-Install-Windows.zip completely.
          2. Run ESP32-Car-Installer.exe with its bundle folder beside it.
          3. Connect the ESP32-CAM through USB/UART and follow the installer.

          Normal firmware updates:
          Install Android/ESP32-Car-OTA-v3.1.0-debug.apk and use Device > Firmware Update.

          Offline recovery:
          Enable ESP32-CAR-UPDATE recovery AP, connect the phone to it, then update from the Android app.
          EOF
          (cd package && zip -q -r ../release/ESP32-Car-v3.1.0-Final.zip .)
          (cd release && sha256sum ESP32-Car-OTA-v3.1.0-debug.apk ESP32-Car-First-Install-Windows.zip firmware.bin ESP32-Car-Firmware-v3.1.0.zip ESP32-Car-v3.1.0-Final.zip > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v3.1.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create v3.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target 7fa6eb01995aa76e33791f234626683940b73f25 \
            --title "ESP32 Car v3.1.0" \
            --notes "Android phone OTA updates, dual-slot ESP32 OTA firmware, offline recovery AP, and a Windows one-click first-install/recovery flasher. Built and verified from main CI run #9." \
            release/ESP32-Car-OTA-v3.1.0-debug.apk \
            release/ESP32-Car-First-Install-Windows.zip \
            release/firmware.bin \
            release/ESP32-Car-Firmware-v3.1.0.zip \
            release/ESP32-Car-v3.1.0-Final.zip \
            release/SHA256SUMS.txt
