name: Verify v3.3.1 Runtime Recovery Contract

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify UI and OTA recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          SCREEN='app/src/main/java/io/github/hoonex/esp32car/ui/screens/FreshCarScreen.kt'
          CLIENT='app/src/main/java/io/github/hoonex/esp32car/network/RCClient.kt'
          LAN='app/src/main/java/io/github/hoonex/esp32car/network/LanArduinoOtaClient.kt'
          ROUTE='app/src/main/java/io/github/hoonex/esp32car/network/AndroidNetworkRoute.kt'
          MAIN='app/src/main/java/io/github/hoonex/esp32car/MainActivity.kt'
          APP='app/build.gradle.kts'
          TEST='app/src/test/java/io/github/hoonex/esp32car/network/LanArduinoOtaClientTest.kt'

          grep -F 'Icons.Default.Settings' "$SCREEN"
          ! grep -F 'Icons.Default.Stop' "$SCREEN"
          ! grep -F 'Text("STOP"' "$SCREEN"
          grep -F 'enabled = cameraAttemptReady && !updateDialog && !firmwareBusy' "$SCREEN"
          grep -F 'FreshSettingsDialog(viewModel = viewModel' "$SCREEN"

          grep -F 'update_begin_failed' "$CLIENT"
          grep -F 'runLanArduinoFallback(' "$CLIENT"
          grep -F 'arduinoota-network-bound' "$CLIENT"

          grep -F 'AndroidNetworkRoute.findWifiRoute(host)' "$LAN"
          grep -F 'ArduinoOtaClient.upload(' "$LAN"
          grep -F 'ESP32 ArduinoOTA는 이 연결 전에 내부 Update.begin()을 실행합니다.' "$LAN"
          grep -F '앱 재시도로는 파티션 테이블을 바꿀 수 없습니다.' "$LAN"
          ! grep -F 'ServerSocket' "$LAN"
          grep -F 'authenticatedWithoutCallbackExplainsPreCallbackUpdateBegin' "$TEST"
          grep -F 'unrelatedNetworkFailureIsNotMisclassifiedAsPartitionFailure' "$TEST"

          grep -F 'NetworkCapabilities.TRANSPORT_WIFI' "$ROUTE"
          grep -F 'AndroidNetworkRoute.initialize(applicationContext)' "$MAIN"

          grep -F 'versionCode = 32' "$APP"
          grep -F 'versionName = "4.0.8"' "$APP"

          echo 'v3.3.1 runtime recovery contract OK'
