name: Build Android + Firmware

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'hardening/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core 3.3.0
        shell: bash
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.0
          python3 -m pip install --user esptool==5.0.2

      - name: Compile AI Thinker ESP32-CAM 2WD firmware
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-sketch build/firmware dist/firmware
          mkdir -p .ci-sketch/ESP32_CAM_RC_Controller build/firmware dist/firmware
          cp firmware/ESP32_CAM_RC_Controller.ino .ci-sketch/ESP32_CAM_RC_Controller/ESP32_CAM_RC_Controller.ino
          cp firmware/partitions.csv .ci-sketch/ESP32_CAM_RC_Controller/partitions.csv

          arduino-cli compile \
            --fqbn esp32:esp32:esp32cam \
            --output-dir build/firmware \
            .ci-sketch/ESP32_CAM_RC_Controller

          find build/firmware -maxdepth 1 -type f -printf '%f %s bytes\n'

          FW="$(find build/firmware -maxdepth 1 -type f -name '*.ino.bin' ! -name '*.bootloader.bin' ! -name '*.partitions.bin' | head -n1)"
          BOOT="$(find build/firmware -maxdepth 1 -type f -name '*.bootloader.bin' | head -n1)"
          PART="$(find build/firmware -maxdepth 1 -type f -name '*.partitions.bin' | head -n1)"
          BOOT_APP0="$(find "$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.0/tools/partitions" -maxdepth 1 -type f -name 'boot_app0.bin' | head -n1)"
          test -n "$FW" && test -n "$BOOT" && test -n "$PART" && test -n "$BOOT_APP0"
          test -s "$FW" && test -s "$BOOT" && test -s "$PART" && test -s "$BOOT_APP0"

          FW_SIZE="$(stat -c%s "$FW")"
          test "$FW_SIZE" -lt 1945600

          cp "$FW" dist/firmware/firmware.bin
          cp "$BOOT" dist/firmware/bootloader.bin
          cp "$PART" dist/firmware/partitions.bin
          cp "$BOOT_APP0" dist/firmware/boot_app0.bin
          cp firmware/partitions.csv dist/firmware/partitions.csv

          cat > dist/firmware/flash_args.txt <<'EOF'
          --flash-mode keep --flash-freq keep --flash-size keep
          0x1000 bootloader.bin
          0x8000 partitions.bin
          0xe000 boot_app0.bin
          0x10000 firmware.bin
          EOF

          python3 -m esptool --chip esp32 merge-bin \
            -o dist/firmware/ESP32-CAM-AI-Thinker-2WD-factory.bin \
            --flash-mode keep \
            --flash-freq keep \
            --flash-size keep \
            0x1000 dist/firmware/bootloader.bin \
            0x8000 dist/firmware/partitions.bin \
            0xe000 dist/firmware/boot_app0.bin \
            0x10000 dist/firmware/firmware.bin
          test -s dist/firmware/ESP32-CAM-AI-Thinker-2WD-factory.bin

      - name: Verify Arduino-compatible flash layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('dist/firmware')
          merged = (root / 'ESP32-CAM-AI-Thinker-2WD-factory.bin').read_bytes()
          layout = [
              (0x1000, 'bootloader.bin'),
              (0x8000, 'partitions.bin'),
              (0xE000, 'boot_app0.bin'),
              (0x10000, 'firmware.bin'),
          ]
          for offset, name in layout:
              data = (root / name).read_bytes()
              actual = merged[offset:offset + len(data)]
              if actual != data:
                  raise SystemExit(f'{name} mismatch at 0x{offset:X}')
              print(f'OK 0x{offset:05X} {name} {len(data)} bytes')
          PY
          grep -Fx '0xe000 boot_app0.bin' dist/firmware/flash_args.txt
          sha256sum dist/firmware/*.bin

      - name: Generate firmware manifest
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'FW_VERSION = "\K[^"]+' firmware/ESP32_CAM_RC_Controller.ino)"
          APP_SHA="$(sha256sum dist/firmware/firmware.bin | awk '{print $1}')"
          APP_SIZE="$(stat -c%s dist/firmware/firmware.bin)"
          BOOT_APP0_SHA="$(sha256sum dist/firmware/boot_app0.bin | awk '{print $1}')"
          FACTORY_SHA="$(sha256sum dist/firmware/ESP32-CAM-AI-Thinker-2WD-factory.bin | awk '{print $1}')"
          FACTORY_SIZE="$(stat -c%s dist/firmware/ESP32-CAM-AI-Thinker-2WD-factory.bin)"
          printf '{"version":"%s","sha256":"%s","size":%s,"boot_app0_sha256":"%s","factory_sha256":"%s","factory_size":%s,"board":"AI Thinker ESP32-CAM","profile":"AI_THINKER_ESP32_CAM_2WD_L298N","flash":"4MB","core":"3.3.0","flash_layout":"arduino-esp32-4-image","boot_app0_offset":"0xE000"}\n' "$VERSION" "$APP_SHA" "$APP_SIZE" "$BOOT_APP0_SHA" "$FACTORY_SHA" "$FACTORY_SIZE" > dist/firmware/manifest.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cat dist/firmware/manifest.json

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: esp32-car-firmware
          path: dist/firmware/
          if-no-files-found: error

  android:
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled firmware
        uses: actions/download-artifact@v4
        with:
          name: esp32-car-firmware
          path: .ci-firmware

      - name: Bundle AI Thinker OTA firmware into Android APK
        shell: bash
        run: |
          mkdir -p app/src/main/assets/firmware
          cp .ci-firmware/firmware.bin app/src/main/assets/firmware/esp32-car.bin
          cp .ci-firmware/manifest.json app/src/main/assets/firmware/manifest.json
          test -s app/src/main/assets/firmware/esp32-car.bin

      - name: Verify automatic app updater contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'android.permission.REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -F 'androidx.core.content.FileProvider' app/src/main/AndroidManifest.xml
          grep -F '<files-path name="app_updates" path="app-updates/"' app/src/main/res/xml/file_paths.xml
          grep -F 'AppUpdater.restoreStagedUpdate(this)' app/src/main/java/io/github/hoonex/esp32car/MainActivity.kt
          grep -F 'installWhenReady = false' app/src/main/java/io/github/hoonex/esp32car/MainActivity.kt
          grep -F 'AppUpdateStage.WAITING_PERMISSION' app/src/main/java/io/github/hoonex/esp32car/MainActivity.kt
          grep -F 'KEY_STAGED_APK' app/src/main/java/io/github/hoonex/esp32car/update/AppUpdater.kt
          grep -F 'signingDigests(current) == signingDigests(archive)' app/src/main/java/io/github/hoonex/esp32car/update/AppUpdater.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Test, lint, and assemble debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon

      - name: Stage CI debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/ci-apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/ci-apk/app.apk
          test -s app/build/ci-apk/app.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/ci-apk/app.apk

      - name: Upload Android CI APK
        uses: actions/upload-artifact@v4
        with:
          name: esp32-car-test-debug-apk
          path: app/build/ci-apk/app.apk
          if-no-files-found: error
