name: Build Android + Firmware

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'hardening/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core 3.3.0
        shell: bash
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.0
          python3 -m pip install --user esptool==5.0.2

      - name: Compile AI Thinker ESP32-CAM 2WD firmware
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-sketch build/firmware dist/firmware
          mkdir -p .ci-sketch/ESP32_CAM_RC_Controller build/firmware dist/firmware
          cp firmware/ESP32_CAM_RC_Controller.ino .ci-sketch/ESP32_CAM_RC_Controller/ESP32_CAM_RC_Controller.ino
          cp firmware/partitions.csv .ci-sketch/ESP32_CAM_RC_Controller/partitions.csv

          arduino-cli compile \
            --fqbn esp32:esp32:esp32cam \
            --output-dir build/firmware \
            .ci-sketch/ESP32_CAM_RC_Controller

          find build/firmware -maxdepth 1 -type f -printf '%f %s bytes\n'

          FW="$(find build/firmware -maxdepth 1 -type f -name '*.ino.bin' ! -name '*.bootloader.bin' ! -name '*.partitions.bin' | head -n1)"
          BOOT="$(find build/firmware -maxdepth 1 -type f -name '*.bootloader.bin' | head -n1)"
          PART="$(find build/firmware -maxdepth 1 -type f -name '*.partitions.bin' | head -n1)"
          BOOT_APP0="$(find "$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.0/tools/partitions" -maxdepth 1 -type f -name 'boot_app0.bin' | head -n1)"
          test -n "$FW" && test -n "$BOOT" && test -n "$PART" && test -n "$BOOT_APP0"
          test -s "$FW" && test -s "$BOOT" && test -s "$PART" && test -s "$BOOT_APP0"

          FW_SIZE="$(stat -c%s "$FW")"
          test "$FW_SIZE" -lt 1945600

          cp "$FW" dist/firmware/firmware.bin
          cp "$BOOT" dist/firmware/bootloader.bin
          cp "$PART" dist/firmware/partitions.bin
          cp "$BOOT_APP0" dist/firmware/boot_app0.bin
          cp firmware/partitions.csv dist/firmware/partitions.csv

          cat > dist/firmware/flash_args.txt <<'EOF'
          --flash-mode keep --flash-freq keep --flash-size keep
          0x1000 bootloader.bin
          0x8000 partitions.bin
          0xe000 boot_app0.bin
          0x10000 firmware.bin
          EOF

          python3 -m esptool --chip esp32 merge-bin \
            -o dist/firmware/ESP32-CAM-AI-Thinker-2WD-factory.bin \
            --flash-mode keep \
            --flash-freq keep \
            --flash-size keep \
            0x1000 dist/firmware/bootloader.bin \
            0x8000 dist/firmware/partitions.bin \
            0xe000 dist/firmware/boot_app0.bin \
            0x10000 dist/firmware/firmware.bin
          test -s dist/firmware/ESP32-CAM-AI-Thinker-2WD-factory.bin

      - name: Verify Arduino-compatible flash layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('dist/firmware')
          merged = (root / 'ESP32-CAM-AI-Thinker-2WD-factory.bin').read_bytes()
          layout = [
              (0x1000, 'bootloader.bin'),
              (0x8000, 'partitions.bin'),
              (0xE000, 'boot_app0.bin'),
              (0x10000, 'firmware.bin'),
          ]
          for offset, name in layout:
              data = (root / name).read_bytes()
              actual = merged[offset:offset + len(data)]
              if actual != data:
                  raise SystemExit(f'{name} mismatch at 0x{offset:X}')
              print(f'OK 0x{offset:05X} {name} {len(data)} bytes')
          PY
          grep -Fx '0xe000 boot_app0.bin' dist/firmware/flash_args.txt
          sha256sum dist/firmware/*.bin

      - name: Generate firmware manifest
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'FW_VERSION = "\K[^"]+' firmware/ESP32_CAM_RC_Controller.ino)"
          APP_SHA="$(sha256sum dist/firmware/firmware.bin | awk '{print $1}')"
          APP_SIZE="$(stat -c%s dist/firmware/firmware.bin)"
          BOOT_APP0_SHA="$(sha256sum dist/firmware/boot_app0.bin | awk '{print $1}')"
          FACTORY_SHA="$(sha256sum dist/firmware/ESP32-CAM-AI-Thinker-2WD-factory.bin | awk '{print $1}')"
          FACTORY_SIZE="$(stat -c%s dist/firmware/ESP32-CAM-AI-Thinker-2WD-factory.bin)"
          printf '{"version":"%s","sha256":"%s","size":%s,"boot_app0_sha256":"%s","factory_sha256":"%s","factory_size":%s,"board":"AI Thinker ESP32-CAM","profile":"AI_THINKER_ESP32_CAM_2WD_L298N","flash":"4MB","core":"3.3.0","flash_layout":"arduino-esp32-4-image","boot_app0_offset":"0xE000"}\n' "$VERSION" "$APP_SHA" "$APP_SIZE" "$BOOT_APP0_SHA" "$FACTORY_SHA" "$FACTORY_SIZE" > dist/firmware/manifest.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cat dist/firmware/manifest.json

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: esp32-car-firmware
          path: dist/firmware/
          if-no-files-found: error

  android:
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      apk_artifact: ${{ steps.apk_meta.outputs.artifact_name }}
      persistent_signing: ${{ steps.signing.outputs.available }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled firmware
        uses: actions/download-artifact@v4
        with:
          name: esp32-car-firmware
          path: .ci-firmware

      - name: Bundle AI Thinker OTA firmware into Android APK
        shell: bash
        run: |
          mkdir -p app/src/main/assets/firmware
          cp .ci-firmware/firmware.bin app/src/main/assets/firmware/esp32-car.bin
          cp .ci-firmware/manifest.json app/src/main/assets/firmware/manifest.json
          test -s app/src/main/assets/firmware/esp32-car.bin

      - name: Verify automatic app updater contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'android.permission.REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -F 'androidx.core.content.FileProvider' app/src/main/AndroidManifest.xml
          grep -F '<files-path name="app_updates" path="app-updates/"' app/src/main/res/xml/file_paths.xml
          grep -F 'AppUpdater.restoreStagedUpdate(this)' app/src/main/java/io/github/hoonex/esp32car/MainActivity.kt
          grep -F 'installWhenReady = false' app/src/main/java/io/github/hoonex/esp32car/MainActivity.kt
          grep -F 'AppUpdateStage.WAITING_PERMISSION' app/src/main/java/io/github/hoonex/esp32car/MainActivity.kt
          grep -F 'KEY_STAGED_APK' app/src/main/java/io/github/hoonex/esp32car/update/AppUpdater.kt
          grep -F 'signingDigests(current) == signingDigests(archive)' app/src/main/java/io/github/hoonex/esp32car/update/AppUpdater.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Test, lint, and assemble debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare persistent release signing
        id: signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD_SECRET" ] && [ -n "$ANDROID_KEY_ALIAS_SECRET" ] && [ -n "$ANDROID_KEY_PASSWORD_SECRET" ]; then
            KEYSTORE="$RUNNER_TEMP/esp32-car-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            test -s "$KEYSTORE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Persistent Android signing secrets are not configured; official Android release will be skipped."
          fi

      - name: Build persistent-signed release APK
        if: steps.signing.outputs.available == 'true'
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Select APK artifact
        id: apk_meta
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          mkdir -p app/build/ci-apk
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk app/build/ci-apk/app.apk
            echo "artifact_name=esp32-car-release-apk" >> "$GITHUB_OUTPUT"
            echo "kind=persistent-signed-release" >> "$GITHUB_OUTPUT"
          else
            cp app/build/outputs/apk/debug/app-debug.apk app/build/ci-apk/app.apk
            echo "artifact_name=esp32-car-test-debug-apk" >> "$GITHUB_OUTPUT"
            echo "kind=ephemeral-debug-test-only" >> "$GITHUB_OUTPUT"
          fi
          test -s app/build/ci-apk/app.apk

      - name: Verify bundled firmware and APK signature
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          unzip -l app/build/ci-apk/app.apk | grep 'assets/firmware/esp32-car.bin'
          unzip -l app/build/ci-apk/app.apk | grep 'assets/firmware/manifest.json'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/ci-apk/app.apk
          if [ "$SIGNED" = "true" ]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/ci-apk/app.apk
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_meta.outputs.artifact_name }}
          path: app/build/ci-apk/app.apk
          if-no-files-found: error

  release-android:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.android.outputs.persistent_signing == 'true'
    needs: [firmware, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Android release version
        id: release_meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)"
          test -n "$VERSION"
          TAG="android-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download persistent-signed Android APK
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android.outputs.apk_artifact }}
          path: release/android

      - name: Download existing published APK without replacing it
        if: steps.release_meta.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          APP_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          mkdir -p release/android
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ESP32-Car-v${APP_VERSION}.apk" \
            --dir release/android

      - name: Download firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: esp32-car-firmware
          path: release/firmware

      - name: Prepare release assets
        shell: bash
        env:
          APP_VERSION: ${{ steps.release_meta.outputs.version }}
          FW_VERSION: ${{ needs.firmware.outputs.version }}
          RELEASE_EXISTS: ${{ steps.release_meta.outputs.exists }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_EXISTS" = "true" ]; then
            cp "release/android/ESP32-Car-v${APP_VERSION}.apk" "release/ESP32-Car-v${APP_VERSION}.apk"
          else
            mv release/android/app.apk "release/ESP32-Car-v${APP_VERSION}.apk"
          fi
          cp release/firmware/firmware.bin "release/ESP32-Car-AI-Thinker-2WD-OTA-v${FW_VERSION}.bin"
          cp release/firmware/manifest.json release/firmware-manifest.json
          (
            cd release
            sha256sum \
              "ESP32-Car-v${APP_VERSION}.apk" \
              "ESP32-Car-AI-Thinker-2WD-OTA-v${FW_VERSION}.bin" \
              firmware-manifest.json > SHA256SUMS.txt
          )
          cat > release/RELEASE_NOTES.md <<EOF
          ESP32 Car Android v${APP_VERSION}

          - Persistent-signed official Android APK for the in-app automatic update channel
          - Automatic release check, verified background download, persistent staging, and safe deferred installation
          - Android package/version/SHA-256/signing-certificate validation before installation
          - Installation is deferred while Bluetooth driving is connected
          - Bluetooth SPP driving remains compatible with the original v3.x firmware
          - Wi-Fi camera/status and authenticated HTTP OTA remain independent from Bluetooth driving
          - First-install/recovery remains the Arduino IDE .ino path; unverified Windows flasher packages are not published

          Built from main commit ${GITHUB_SHA}.
          ESP32 firmware: ${FW_VERSION}.
          Hardware: AI Thinker ESP32-CAM, 4MB flash, 2WD L298N profile.
          EOF

      - name: Publish new GitHub Release
        if: steps.release_meta.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          APP_VERSION: ${{ steps.release_meta.outputs.version }}
          FW_VERSION: ${{ needs.firmware.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ESP32 Car Android v${APP_VERSION}" \
            --notes-file release/RELEASE_NOTES.md \
            "release/ESP32-Car-v${APP_VERSION}.apk" \
            "release/ESP32-Car-AI-Thinker-2WD-OTA-v${FW_VERSION}.bin" \
            release/firmware-manifest.json \
            release/SHA256SUMS.txt

      - name: Repair existing release firmware assets without replacing APK
        if: steps.release_meta.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          APP_VERSION: ${{ steps.release_meta.outputs.version }}
          FW_VERSION: ${{ needs.firmware.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "release/ESP32-Car-AI-Thinker-2WD-OTA-v${FW_VERSION}.bin" \
            release/firmware-manifest.json \
            release/SHA256SUMS.txt
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release/RELEASE_NOTES.md
